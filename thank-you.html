<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Lakshya Academy Bhopal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#071A3D,#0B2A5B);
padding:20px;
}

.card{
max-width:700px;
width:100%;
background:white;
border-radius:30px;
padding:50px;
text-align:center;
box-shadow:0 30px 60px rgba(0,0,0,.35);
}

.check{
width:90px;
height:90px;
margin:0 auto 25px;
border-radius:50%;
background:#22c55e;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
color:white;
box-shadow:0 15px 35px rgba(34,197,94,.4);
}

h1{
font-size:42px;
color:#071A3D;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.8;
color:#555;
margin-bottom:30px;
}

.info{
background:#F5F7FB;
padding:20px;
border-radius:18px;
margin-bottom:30px;
}

.info h3{
color:#071A3D;
margin-bottom:10px;
}

.info p{
margin:0;
font-size:16px;
}

.btn{
display:inline-block;
padding:14px 30px;
background:#FF7A00;
color:white;
text-decoration:none;
border-radius:12px;
font-weight:600;
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
background:#E66A00;
}

.phone{
display:block;
margin-top:20px;
font-size:18px;
font-weight:600;
color:#071A3D;
text-decoration:none;
}

@media(max-width:768px){

.card{
padding:35px 25px;
}

h1{
font-size:30px;
}

p{
font-size:16px;
}

}

</style>

</head>

<body>

<div class="card">

<div class="check">✓</div>

<h1>Thank You!</h1>

<p>
Your enquiry has been submitted successfully.
Our admission counselor will contact you shortly.
</p>

<div class="info">

<h3>What Happens Next?</h3>

<p>✔ We'll call you shortly.</p>
<p>✔ Schedule your Free Demo Class.</p>
<p>✔ Visit our Bhopal campus.</p>

</div>

<a href="index.html" class="btn">
Back to Home
</a>

<a href="tel:+919876543210" class="phone">
📞 +91 98765 43210
</a>

</div>

</body>
</html>
